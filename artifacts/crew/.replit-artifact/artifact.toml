kind = "web"
previewPath = "/"
title = "Crew"
description = "A mobile-friendly climbing partner finder for discovering belay partners, bouldering buddies, outdoor trip companions, and local group meetups by gym, climbing style, and availability."
version = "1.0.0"
id = "artifacts/crew"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21851

[services.development]
run = "pnpm --filter @workspace/crew run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/crew", "run", "build" ]
serve = "static"
publicDir = "artifacts/crew/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21851"
BASE_PATH = "/"
